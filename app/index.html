<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Panels — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Sunset Panels</h1>
    <p>Turn your photos into a multi-panel Vice City cover. Click a panel to select it, drag to reposition, zoom to crop.</p>

    <div class="row">
      <label>Panels
        <select id="layout">
          <option value="auto" selected>Auto</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label>Caption <input id="caption" type="text" maxlength="32" value="Sunset Heist"></label>
    </div>
    <label>Tagline <input id="tagline" type="text" maxlength="40" value="Welcome to the boulevard"></label>

    <div id="slots"></div>

    <div class="row">
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <button id="center" type="button">Center panel</button>
    </div>
    <p class="hint">Drag on the preview to move the selected panel's photo.</p>

    <div class="row">
      <label>Export size
        <select id="size">
          <option value="1080x1080" selected>1080 x 1080</option>
          <option value="1080x1350">1080 x 1350</option>
          <option value="1920x1080">1920 x 1080</option>
        </select>
      </label>
      <button id="export" type="button">Export PNG</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" width="810" height="810" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
