<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Poster — a GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <header>
      <h1>Sunset Poster</h1>
      <p class="sub">A photo and a caption, into a neon multi-panel poster.</p>
    </header>

    <fieldset>
      <legend>Photo</legend>
      <label class="file">
        <input id="photo" type="file" accept="image/*">
        <span>Choose a photo…</span>
      </label>
      <div class="row">
        <button type="button" id="sample-pier">Sample · pier</button>
        <button type="button" id="sample-boulevard">Sample · boulevard</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Title <input id="title" type="text" maxlength="30" value="Sunset Heist"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="30" value="Palm &amp; Neon"></label>
    </fieldset>

    <fieldset>
      <legend>Panels</legend>
      <div class="row seg">
        <button type="button" data-panels="2">2</button>
        <button type="button" data-panels="3" class="on">3</button>
        <button type="button" data-panels="4">4</button>
      </div>
      <label class="slider">Crop zoom <span id="zoom-val">1.12×</span>
        <input id="zoom" type="range" min="1" max="2.4" step="0.01" value="1.12">
      </label>
      <p class="hint">Drag inside a panel to reposition the photo.</p>
    </fieldset>

    <fieldset>
      <legend>Export PNG</legend>
      <div class="row seg">
        <button type="button" data-format="square" class="on">1:1</button>
        <button type="button" data-format="portrait">4:5</button>
        <button type="button" data-format="landscape">16:9</button>
      </div>
      <div class="row">
        <button type="button" class="export" data-export="0">1080 × 1080</button>
        <button type="button" class="export" data-export="1">1080 × 1350</button>
        <button type="button" class="export" data-export="2">1920 × 1080</button>
      </div>
    </fieldset>

    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" aria-label="Poster preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
